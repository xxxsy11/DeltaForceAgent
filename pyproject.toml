[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-agent"
version = "0.8.0"
description = "DeltaForce GraphRAG, Multi-Agent, LoRA-SFT and Agentic RL workspace"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
